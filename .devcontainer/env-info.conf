# Drives the on-attach banner the devbase Feature prints. Sourced as shell, so
# quote values containing spaces.
#
# This replaces the hand-written supporting_files/scripts/env-info.sh: the
# Container group (OS, Git, gh), the PHP group (PHP, Composer) and the Node group
# (Node.js with the package.json engines check, npm, pnpm) are all built into the
# Feature. Only what is specific to this repository is set below.
#
# Run `devbase-env-info` to print the banner by hand.

# The Feature's default would be the repository directory name
# ("rtldev-middleware-php-sdk"). Kept as the shorter product name the banner has
# always used.
TITLE="PHP-SDK - development environment"

# The runtime floor is 8.3 with no ceiling, but the source language-feature
# ceiling is pinned at 8.3 because WHMCS ships ionCube-encoded (RSRMID-2826), so
# an accidental drift has to be visible here.
PHP_NOTE="(language-feature ceiling: 8.3)"

# curl is a hard requirement in composer.json; intl is loaded from the system
# package by supporting_files/configuration/php/intl.ini; xdebug carries the
# coverage mode `composer test` depends on. All three read as absent rather than
# wrong if the ini provisioning ever fails.
PHP_EXTENSIONS="curl intl xdebug"
