name: Dependabot auto-merge & tests
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            relevant:
              - 'src/**'
              - 'tests/**'
              - '.github/phpunit.xml'
              - 'composer.json'
              - 'composer.lock'

  tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: centralnicgroup-opensource/rtldev-middleware-shareable-workflows/.github/workflows/php-sdk-test.yml@main
    secrets: inherit

  ci-success:
    name: "Tests: completed"
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.tests.result }}" != "success" ] && [ "${{ needs.tests.result }}" != "skipped" ]; then
            echo "Tests failed or were cancelled"
            exit 1
          fi
