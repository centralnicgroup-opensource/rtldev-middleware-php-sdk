name: Lint & Security
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  # Delegates to the shared php-sdk-lint workflow, which runs these jobs:
  #   composer-audit (composer audit --no-dev — dependency CVE gating),
  #   trufflehog, actionlint, hadolint, prettier, shellcheck, phpcs, phpstan, psalm.
  # prettier is opt-in there (default false) because it needs a Node toolchain in
  # the calling repo; we have one, so we ask for it.
  # See: centralnicgroup-opensource/rtldev-middleware-shareable-workflows
  #      .github/workflows/php-sdk-lint.yml
  lint:
    uses: centralnicgroup-opensource/rtldev-middleware-shareable-workflows/.github/workflows/php-sdk-lint.yml@main
    with:
      prettier: true
      # Empty, so pnpm/action-setup resolves the version from
      # `devEngines.packageManager` in package.json rather than installing whatever
      # pnpm is newest. (RSRMID-3008)
      pnpm-version: ""
    secrets: inherit

  ci-success:
    name: "Lint: completed"
    needs: lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            exit 1
          fi
