---
# Reports when this repository's GitHub settings no longer match
# .github/repo-settings.conf. Read-only by construction: it runs the script in check
# mode, which never writes. Applying stays manual — see the script's header for why a
# workflow is the wrong place to hold admin rights.
name: Repository settings drift

"on":
  schedule:
    # Monday morning, so a drift lands at the start of the week rather than in it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Settings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GITHUB_TOKEN reads the core settings and topics fine, but the security
      # toggles need administration:read, which it does not have — the script then
      # reports those as "unreadable" rather than counting them as drift, so the job
      # stays honest instead of green-by-omission. Since the two settings most likely
      # to drift here are exactly those (secret scanning and push protection), a run
      # on GITHUB_TOKEN alone means "the settings I could read are correct", not
      # "everything is".
      #
      # RTLDEV_MW_CI_TOKEN is the existing credential with the wider scope, so it is
      # tried first and no new secret is needed. REPO_SETTINGS_TOKEN stays ahead of
      # it as an override, in case this job should ever run on a narrower,
      # purpose-scoped token than the shared CI one.
      #
      # If the run still reports the security rows as unreadable, the token in use
      # lacks administration:read — check that before assuming the settings are fine.
      - name: Check settings against repo-settings.conf
        env:
          GH_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN || secrets.RTLDEV_MW_CI_TOKEN || secrets.GITHUB_TOKEN }}
        run: scripts/repo-settings.sh
