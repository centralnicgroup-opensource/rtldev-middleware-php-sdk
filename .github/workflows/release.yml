name: Release
"on":
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  deployments: write
  id-token: write

jobs:
  release:
    uses: centralnicgroup-opensource/rtldev-middleware-shareable-workflows/.github/workflows/php-sdk-release.yml@main
    secrets: inherit
    with:
      # Empty, so pnpm/action-setup resolves the version from
      # `devEngines.packageManager` in package.json rather than installing whatever
      # pnpm is newest. (RSRMID-3008)
      pnpm-version: ""
