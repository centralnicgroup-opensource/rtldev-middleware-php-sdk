# Desired GitHub repository settings.
#
# GitHub settings are not in the repository, so nothing records what they are meant
# to be and drift is invisible until somebody looks. This file records them;
# scripts/repo-settings.sh reconciles them.
#
#   pnpm repo:settings          # report drift, change nothing
#   pnpm repo:settings:apply    # make GitHub match this file (needs admin)
#
# Sourced as shell: quote values with spaces, booleans are bare true/false.
# Secret *values* are out of scope — only names, for the drift check.

# --- Identity ----------------------------------------------------------------
DESCRIPTION="API connector library for the Team Internet backend APIs (CentralNic Reseller, Internet.bs, Moniker)"

# The Doctum API docs, published to gh-pages on release.
HOMEPAGE="https://centralnicgroup-opensource.github.io/rtldev-middleware-php-sdk/"

# Space-separated; lowercase, digits and hyphens only.
TOPICS="php php-sdk rtldev middleware domains registrar api centralnic"

# This repository was not created from a template and is not one.
IS_TEMPLATE=false

# --- Merge behaviour ---------------------------------------------------------
# Squash merging off: it collapses the Conventional Commit messages semantic-release
# reads to pick the next version. Rebase keeps them.
ALLOW_SQUASH_MERGE=false
ALLOW_REBASE_MERGE=true
ALLOW_MERGE_COMMIT=false

# Safe only alongside required checks, which branch protection sets.
ALLOW_AUTO_MERGE=true

DELETE_BRANCH_ON_MERGE=true

# --- Features ----------------------------------------------------------------
# Issues on: .github/ISSUE_TEMPLATE/ ships here (RSRMID-2986) and is how external
# reporters reach us. Support contacts are brand-specific, so a GitHub issue is the
# only generic route — turning issues off would close it.
HAS_ISSUES=true
HAS_PROJECTS=false
HAS_WIKI=false
HAS_DISCUSSIONS=false

# --- Security ----------------------------------------------------------------
# Private vulnerability reporting is what .github/SECURITY.md points at.
PRIVATE_VULNERABILITY_REPORTING=true
VULNERABILITY_ALERTS=true
AUTOMATED_SECURITY_FIXES=true

# Push protection matters more here than in most repositories: this is a public repo
# for a registrar API client, and env.sh exists because contributors hold live API
# credentials locally. Push protection is what stops one reaching a public commit.
SECRET_SCANNING=true
SECRET_SCANNING_PUSH_PROTECTION=true

# --- Branch protection -------------------------------------------------------
# Left false deliberately. This repository is protected by *classic* branch
# protection, not a ruleset, and the script only manages a repository-level ruleset
# when this is true — pointing it here would add a second overlapping control rather
# than manage the existing one. The four values below therefore record intent and are
# NOT enforced by the tooling; REQUIRED_APPROVALS and REQUIRE_LINEAR_HISTORY are both
# open drift against the live settings. Resolving that means either an organisation
# ruleset targeting rtldev-middleware-*, or migrating this repository off classic
# protection — a decision, not a config change.
RULESET_ENABLED=false
RULESET_NAME="default-branch-protection"

DEFAULT_BRANCH="master"

# Zero deliberately, not an oversight. This is a small maintainer team and the
# release path depends on merges not stalling; the required checks are the gate that
# matters here. Do not "fix" this to 1 without that being an actual decision.
REQUIRED_APPROVALS=0

# Both only take effect where reviews are required, so they are inert at
# REQUIRED_APPROVALS=0 — kept as the intended shape if approvals are ever turned on.
DISMISS_STALE_REVIEWS=true
REQUIRE_LAST_PUSH_APPROVAL=true

REQUIRE_LINEAR_HISTORY=true

# Comma-separated. Both are aggregate jobs, so adding a job to either workflow needs
# no change here.
REQUIRED_CHECKS="Lint: completed,Tests: completed"

# --- Drift check only --------------------------------------------------------
# Space-separated names that must exist. Values are never read or written.
#
# EXPECTED_SECRETS is empty because this repository has no *repository-level* secrets
# to check — not because the names are unknown.
#
# Every secret this repository uses is organisation-wide: RTLDEV_MW_CI_TOKEN, which
# the drift workflow authenticates with, and the RTLDEV_MW_CI_* credentials behind
# `composer test:record` (the same names as in env.example.sh), all provided at the
# org level. lint.yml and test.yml reach them via `secrets: inherit`, which is why no
# name appears anywhere in this repository.
#
# This check reads the *repository* secrets endpoint, and org secrets do not appear
# there. Listing one would report it permanently absent — a workflow authenticating
# successfully with a secret the drift check insists is missing, failing every Monday
# for a reason that is not true. So org-level names must stay out of this list, and
# with them the whole of this repository's current set.
#
# Add a name here only if a genuinely repository-level secret is created later.
EXPECTED_SECRETS=""

# Empty for the same reason as EXPECTED_SECRETS above. RTLDEV_MW_CI_PHP_MATRIX, which
# drives the CI PHP matrix, is organisation-level, so it does not appear on the
# repository variables endpoint this check reads and listing it would report it
# permanently absent.
EXPECTED_VARIABLES=""
